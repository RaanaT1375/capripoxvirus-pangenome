name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  lint:
    name: Parse and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "23.10.0"

      - name: Workflow parses and help renders
        run: nextflow run . --help

      - name: No tabs in Nextflow files
        run: |
          if grep -rlP "\t" --include="*.nf" .; then
            echo "Tabs found in .nf files; they break Groovy heredocs."
            exit 1
          fi

      - name: Python scripts compile
        run: python3 -m compileall -q bin/

  stub:
    name: Stub run
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "23.10.0"

      # -stub-run executes each process's stub block instead of the real
      # command, so the whole workflow graph is exercised without installing
      # any bioinformatics software. This checks the wiring, not the science.
      - name: Verify the workflow wiring
        run: nextflow run . -profile test -stub-run --outdir results_test

      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-report
          path: results_test/pipeline_info/
