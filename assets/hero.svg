<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" role="img" aria-labelledby="t d">
<title id="t">Capripoxvirus pangenome and selection pipeline</title>
<desc id="d">A 151 kb poxvirus genome axis with inverted terminal repeats, recombination blocks and a sixteen-stage analysis track beneath it.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#08131F"/>
    <stop offset="0.55" stop-color="#0B1B2B"/>
    <stop offset="1" stop-color="#101F30"/>
  </linearGradient>
  <linearGradient id="core" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"    stop-color="#585D26"/>
    <stop offset="0.055" stop-color="#90A0BC"/>
    <stop offset="0.5"  stop-color="#C6D0E0"/>
    <stop offset="0.945" stop-color="#90A0BC"/>
    <stop offset="1"    stop-color="#585D26"/>
  </linearGradient>
  <linearGradient id="dens" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#90A0BC" stop-opacity="0.15"/>
    <stop offset="1" stop-color="#871746" stop-opacity="0.95"/>
  </linearGradient>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#871746"/>
    <stop offset="0.45" stop-color="#CB9A9F"/>
    <stop offset="1" stop-color="#0B1B2B" stop-opacity="0"/>
  </linearGradient>
</defs>

<rect width="1240" height="560" fill="url(#bg)"/>

<!-- ================= header ================= -->
<text x="70" y="76" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" letter-spacing="4.5" fill="#CB9A9F">CAPRIPOXVIRUS &#183; 290 GENOMES &#183; LSDV / SPPV / GTPV</text>

<text x="68" y="128" font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="45" fill="#F2F5F8">Pangenomics of a genome</text>
<text x="68" y="176" font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="45" font-style="italic" fill="#CB9A9F">that stopped changing</text>

<rect x="70" y="198" width="300" height="2" fill="url(#rule)"/>

<text x="70" y="230" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8FA3B8">Reproducible Nextflow pipeline for pangenome construction,</text>
<text x="70" y="250" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8FA3B8">recombination tracking and population-genetic selection inference.</text>

<!-- ================= key figures ================= -->
<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
  <g transform="translate(792,96)">
    <text x="0" y="0" font-size="10.5" letter-spacing="1.6" fill="#6E8399">ORTHOGROUPS</text>
    <text x="0" y="36" font-size="32" fill="#F2F5F8">132</text>
    <text x="63" y="36" font-size="11.5" fill="#5C7181">/206</text>
  </g>
  <g transform="translate(952,96)">
    <text x="0" y="0" font-size="10.5" letter-spacing="1.6" fill="#6E8399">r / m</text>
    <text x="0" y="36" font-size="32" fill="#90A0BC">0.13</text>
  </g>
  <g transform="translate(1092,96)">
    <text x="0" y="0" font-size="10.5" letter-spacing="1.6" fill="#6E8399">&#945; LSDV BRANCH</text>
    <text x="0" y="36" font-size="32" fill="#CB9A9F">0.60</text>
  </g>
  <g transform="translate(792,180)">
    <text x="0" y="0" font-size="10.5" letter-spacing="1.6" fill="#6E8399">CORE GENES</text>
    <text x="0" y="34" font-size="32" fill="#F2F5F8">60</text>
  </g>
  <g transform="translate(952,180)">
    <text x="0" y="0" font-size="10.5" letter-spacing="1.6" fill="#6E8399">RECOMB. BLOCKS</text>
    <text x="0" y="34" font-size="32" fill="#90A0BC">90</text>
  </g>
  <g transform="translate(1092,180)">
    <text x="0" y="0" font-size="10.5" letter-spacing="1.6" fill="#6E8399">COUNTRIES</text>
    <text x="0" y="34" font-size="32" fill="#F2F5F8">45</text>
  </g>
</g>

<!-- ================= genome axis ================= -->
<g transform="translate(70,300)">
  <text x="0" y="-16" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" letter-spacing="2.6" fill="#6E8399">RECOMBINATION DENSITY ACROSS THE 151 kb CHROMOSOME</text>

  <!-- density profile: enriched towards both termini -->
  <path d="M0,46 L0,20 L18,14 L34,26 L52,34 L74,41 L96,37 L120,44 L150,46 L200,45 L260,46 L340,45 L430,46 L520,45 L610,46 L700,44 L790,45 L860,42 L920,36 L960,40 L1000,28 L1030,16 L1050,10 L1064,18 L1080,46 Z"
        fill="url(#dens)"/>
  <path d="M0,20 L18,14 L34,26 L52,34 L74,41 L96,37 L120,44 L150,46 L200,45 L260,46 L340,45 L430,46 L520,45 L610,46 L700,44 L790,45 L860,42 L920,36 L960,40 L1000,28 L1030,16 L1050,10 L1064,18 L1080,46"
        fill="none" stroke="#E4E9F0" stroke-width="1.1" stroke-linejoin="round"/>

  <!-- chromosome -->
  <rect x="0" y="52" width="1080" height="15" rx="2" fill="url(#core)"/>
  <rect x="0" y="52" width="20" height="15" rx="2" fill="#585D26"/>
  <rect x="1060" y="52" width="20" height="15" rx="2" fill="#585D26"/>

  <text x="0"    y="86" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8FA3B8">ITR</text>
  <text x="504"  y="86" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8FA3B8">CONSERVED CENTRAL CORE</text>
  <text x="1046" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8FA3B8">ITR</text>

  <!-- recombination blocks -->
  <g fill="#002F57" stroke="#5C7FA6" stroke-width="0.5">
    <rect x="6"   y="98" width="70" height="5" rx="2"/>
    <rect x="88"  y="98" width="44" height="5" rx="2"/>
    <rect x="150" y="98" width="30" height="5" rx="2"/>
    <rect x="214" y="98" width="22" height="5" rx="2"/>
    <rect x="336" y="98" width="26" height="5" rx="2"/>
    <rect x="452" y="98" width="18" height="5" rx="2"/>
    <rect x="596" y="98" width="22" height="5" rx="2"/>
    <rect x="742" y="98" width="30" height="5" rx="2"/>
    <rect x="836" y="98" width="48" height="5" rx="2"/>
    <rect x="946" y="98" width="76" height="5" rx="2"/>
    <rect x="26"  y="106" width="52" height="5" rx="2"/>
    <rect x="110" y="106" width="34" height="5" rx="2"/>
    <rect x="256" y="106" width="24" height="5" rx="2"/>
    <rect x="398" y="106" width="20" height="5" rx="2"/>
    <rect x="520" y="106" width="16" height="5" rx="2"/>
    <rect x="676" y="106" width="26" height="5" rx="2"/>
    <rect x="800" y="106" width="36" height="5" rx="2"/>
    <rect x="898" y="106" width="60" height="5" rx="2"/>
    <rect x="1000" y="106" width="62" height="5" rx="2"/>
  </g>
  <text x="0" y="128" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" letter-spacing="1.6" fill="#5C7FA6">90 RECOMBINATION BLOCKS &#183; 29.2% OF THE ALIGNABLE CORE</text>
</g>

<!-- ================= stage track ================= -->
<g transform="translate(70,470)">
  <line x1="0" y1="0" x2="1080" y2="0" stroke="#22384C" stroke-width="1.4"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" fill="#6E8399">
    <g stroke="#90A0BC" stroke-width="1.6">
      <line x1="0"   y1="-7" x2="0"   y2="7"/>
      <line x1="216" y1="-7" x2="216" y2="7"/>
      <line x1="432" y1="-7" x2="432" y2="7"/>
      <line x1="648" y1="-7" x2="648" y2="7"/>
      <line x1="864" y1="-7" x2="864" y2="7"/>
      <line x1="1080" y1="-7" x2="1080" y2="7" stroke="#871746"/>
    </g>
    <text x="0"   y="26">01 &#183; QC</text>
    <text x="188" y="26">04 &#183; PANGENOME</text>
    <text x="404" y="26">06 &#183; RECOMB</text>
    <text x="620" y="26">09 &#183; CLOCK</text>
    <text x="836" y="26">11 &#183; PAN-GWAS</text>
    <text x="1008" y="26" fill="#CB9A9F">14 &#183; MK</text>
  </g>
</g>

<text x="70" y="536" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" letter-spacing="1.4" fill="#4E657C">NEXTFLOW DSL2 &#183; CONDA / SINGULARITY &#183; SLURM-READY &#183; MIT</text>
</svg>
